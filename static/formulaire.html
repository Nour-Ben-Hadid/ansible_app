<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Formulaire de Deploiement Azure</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        small {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 0.9em;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .deploy-button {
            background-color: #007bff;
        }

        .deploy-button:hover {
            background-color: #0056b3;
        }

        .results {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f8f9fa;
        }

        .success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .deployment-section {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #424abd;
            border-radius: 4px;
            background-color: #f8fff9;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Formulaire de Deploiement Azure</h1>

    <form id="formulaire">
        <div class="form-group">
            <label>Nom Application:</label>
            <input type="text" name="nom_app" required>
        </div>

        <div class="form-group">
            <label>Groupe de Ressources:</label>
            <input type="text" name="resource_group" required>
        </div>

        <div class="form-group">
            <label>URL Depot Git:</label>
            <input type="text" name="app_repo_url" required>
        </div>

        <div class="form-group">
            <label>Branche Depot:</label>
            <input type="text" name="app_repo_branch" required>
        </div>

        <div class="form-group">
            <label>Description:</label>
            <input type="text" name="description">
        </div>

        <input type="hidden" name="app_type" value="web_app">

        <div class="form-group" id="language_group">
            <label>Langage de l'Application:</label>
            <select name="app_language" id="app_language" required>
                <option value="nodejs">Node.js (JavaScript/TypeScript)</option>
                <option value="python">Python (Flask/Django/FastAPI)</option>
            </select>
        </div>

        <div class="form-group" id="python_version_group" style="display: none;">
            <label>Version Python:</label>
            <select name="python_version" id="python_version">
                <option value="3.11">Python 3.11 (Recommande)</option>
                <option value="3.10">Python 3.10</option>
                <option value="3.9">Python 3.9</option>
                <option value="3.8">Python 3.8</option>
            </select>
        </div>

        <div class="form-group" id="startup_file_group">
            <label>Fichier d'entree de votre application (optionnel):</label>
            <input type="text" name="startup_file" id="startup_file" placeholder="ex: server.js, app.js, index.js">
            <small id="startup_help"></small>
        </div>

        <div class="form-group">
            <label>Region Azure:</label>
            <select name="location" id="location" required>
                <option value="">Selectionnez une region</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">Creer Configuration</button>
    </form>

    <div id="resultat" class="results hidden"></div>

    <div id="deploymentSection" class="deployment-section hidden">
        <h3>Pret pour le Deploiement!</h3>
        <p><strong>Job Template AWX cree avec succes!</strong></p>
        <button id="deployBtn" class="deploy-button">Deployer sur Azure</button>
        <div id="deploymentResult" class="results hidden"></div>
    </div>

    <script>
        let currentDeploymentId = null;

        const formulaire = document.getElementById('formulaire');
        const submitBtn = document.getElementById('submitBtn');
        const deployBtn = document.getElementById('deployBtn');
        const resultatDiv = document.getElementById('resultat');
        const deploymentSection = document.getElementById('deploymentSection');
        const deploymentResult = document.getElementById('deploymentResult');
        const appLanguageSelect = document.getElementById('app_language');
        const pythonVersionGroup = document.getElementById('python_version_group');
        const startupFileInput = document.getElementById('startup_file');
        const startupHelp = document.getElementById('startup_help');
        const locationSelect = document.getElementById('location');

        function appendTextElement(parent, tagName, text, className = '') {
            const element = document.createElement(tagName);
            if (className) {
                element.className = className;
            }
            element.textContent = text;
            parent.appendChild(element);
            return element;
        }

        function appendField(parent, label, value) {
            const paragraph = document.createElement('p');
            const strong = document.createElement('strong');
            strong.textContent = `${label}: `;
            paragraph.appendChild(strong);
            paragraph.appendChild(document.createTextNode(value || 'N/A'));
            parent.appendChild(paragraph);
        }

        function appendLinkField(parent, label, value) {
            const paragraph = document.createElement('p');
            const strong = document.createElement('strong');
            strong.textContent = `${label}: `;
            paragraph.appendChild(strong);

            if (value) {
                const link = document.createElement('a');
                link.href = value;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = value;
                paragraph.appendChild(link);
            } else {
                paragraph.appendChild(document.createTextNode('N/A'));
            }

            parent.appendChild(paragraph);
        }

        function appendButton(parent, text, onClick) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = text;
            button.addEventListener('click', onClick);
            parent.appendChild(button);
            return button;
        }

        function setSingleMessage(container, className, message) {
            container.className = className;
            container.classList.remove('hidden');
            container.replaceChildren();
            appendTextElement(container, 'p', message);
        }

        function getErrorMessage(result, fallback) {
            if (!result || !result.detail) {
                return fallback;
            }
            if (typeof result.detail === 'string') {
                return result.detail;
            }
            return JSON.stringify(result.detail);
        }

        function resetLocationOptions(message) {
            locationSelect.replaceChildren();
            const option = document.createElement('option');
            option.value = '';
            option.textContent = message;
            locationSelect.appendChild(option);
        }

        async function loadRegions(appType) {
            try {
                resetLocationOptions('Chargement...');
                const response = await fetch(`/api/regions/${appType}`);
                const data = await response.json();

                resetLocationOptions('Selectionnez une region');

                Object.entries(data.regions).forEach(([displayName, azureCode]) => {
                    const option = document.createElement('option');
                    option.value = azureCode;
                    option.textContent = displayName;
                    locationSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Erreur lors du chargement des regions:', error);
                resetLocationOptions('Erreur de chargement');
            }
        }

        appLanguageSelect.addEventListener('change', function () {
            updateFormFields();
        });

        function updateFormFields() {
            const appLanguage = appLanguageSelect.value;
            const startupFileGroup = document.getElementById('startup_file_group');

            startupFileGroup.style.display = 'block';

            if (appLanguage === 'python') {
                pythonVersionGroup.style.display = 'block';
                startupFileInput.placeholder = 'ex: app.py, main.py, app:app, wsgi:application';
                startupHelp.textContent = 'Specifiez le fichier Python ou module:function. Laissez vide pour gunicorn app:app.';
            } else {
                pythonVersionGroup.style.display = 'none';
                startupFileInput.placeholder = 'ex: server.js, app.js, index.js';
                startupHelp.textContent = "Specifiez le fichier d'entree Node.js. Laissez vide pour npm start.";
            }
        }

        window.addEventListener('DOMContentLoaded', function () {
            loadRegions('web_app');
            updateFormFields();
        });

        formulaire.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creation en cours...';
            setSingleMessage(resultatDiv, 'results', 'Creation du playbook et du job template AWX...');

            try {
                const data = {};
                new FormData(formulaire).forEach((value, key) => data[key] = value);

                const response = await fetch('/api/formulaire', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    resultatDiv.className = 'results success';
                    resultatDiv.classList.remove('hidden');
                    resultatDiv.replaceChildren();

                    const deploymentDetails = result.playbook_result?.deployment_details || {};
                    const appTypeDisplay = 'Web App classique';
                    const languageDisplay = data.app_language === 'python' ? 'Python' : 'Node.js';

                    appendTextElement(resultatDiv, 'h4', 'Configuration creee avec succes!');
                    appendField(resultatDiv, 'ID Formulaire', result.formulaire_id);
                    appendField(resultatDiv, 'Application', data.nom_app);
                    appendField(resultatDiv, 'Type', appTypeDisplay);
                    appendField(resultatDiv, 'Langage', languageDisplay);

                    if (data.python_version && data.app_language === 'python') {
                        appendField(resultatDiv, 'Version Python', data.python_version);
                    }

                    appendField(resultatDiv, 'Nom Unique Azure', deploymentDetails.app_name);
                    appendField(resultatDiv, 'Region', data.location);

                    if (data.startup_file) {
                        appendField(resultatDiv, 'Fichier de Demarrage', data.startup_file);
                    }

                    appendLinkField(resultatDiv, 'URL App', result.playbook_result?.app_url);

                    if (result.can_deploy && result.job_template_id) {
                        currentDeploymentId = result.formulaire_id;
                        deploymentSection.classList.remove('hidden');
                        appendField(resultatDiv, 'Job Template ID', String(result.job_template_id));
                        appendTextElement(resultatDiv, 'p', 'Tout est pret pour le deploiement!');
                    } else {
                        appendTextElement(resultatDiv, 'p', 'Probleme avec la creation du job template AWX', 'error');
                    }
                } else {
                    const message = getErrorMessage(result, 'Erreur inconnue');
                    setSingleMessage(resultatDiv, 'results error', `Erreur: ${message}`);
                }
            } catch (error) {
                setSingleMessage(resultatDiv, 'results error', `Erreur de connexion: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Creer Configuration';
            }
        });

        deployBtn.addEventListener('click', async () => {
            if (!currentDeploymentId) {
                alert('Aucun deploiement disponible!');
                return;
            }

            deployBtn.disabled = true;
            deployBtn.textContent = 'Deploiement en cours...';
            setSingleMessage(deploymentResult, 'results', 'Lancement du deploiement AWX...');

            try {
                const response = await fetch(`/api/deployments/${currentDeploymentId}/launch`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok) {
                    deploymentResult.className = 'results success';
                    deploymentResult.classList.remove('hidden');
                    deploymentResult.replaceChildren();
                    appendTextElement(deploymentResult, 'h4', 'Deploiement lance avec succes!');
                    appendField(deploymentResult, 'Job ID', String(result.job_id));
                    appendField(deploymentResult, 'Statut', result.status);
                    appendTextElement(deploymentResult, 'p', 'Vous pouvez suivre le progres dans AWX.');
                    appendButton(deploymentResult, 'Rafraichir statut', refreshDeploymentStatus);
                } else {
                    const message = getErrorMessage(result, 'Erreur inconnue');
                    setSingleMessage(deploymentResult, 'results error', `Erreur de deploiement: ${message}`);
                }
            } catch (error) {
                setSingleMessage(deploymentResult, 'results error', `Erreur de connexion: ${error.message}`);
            } finally {
                deployBtn.disabled = false;
                deployBtn.textContent = 'Deployer sur Azure';
            }
        });

        async function refreshDeploymentStatus() {
            if (!currentDeploymentId) {
                return;
            }

            setSingleMessage(deploymentResult, 'results', 'Lecture du statut AWX...');
            try {
                const response = await fetch(`/api/deployments/${currentDeploymentId}/refresh`);
                const result = await response.json();

                if (response.ok) {
                    deploymentResult.className = result.status === 'FAILED' ? 'results error' : 'results success';
                    deploymentResult.classList.remove('hidden');
                    deploymentResult.replaceChildren();
                    appendTextElement(deploymentResult, 'h4', 'Statut du deploiement');
                    appendField(deploymentResult, 'Statut', result.status);
                    appendField(deploymentResult, 'Job AWX', String(result.awx_job_id || 'N/A'));
                    appendField(deploymentResult, 'Statut AWX', result.awx?.status || 'N/A');
                    if (result.error_message) {
                        appendField(deploymentResult, 'Erreur', result.error_message);
                    }
                    appendButton(deploymentResult, 'Rafraichir statut', refreshDeploymentStatus);
                } else {
                    const message = getErrorMessage(result, 'Erreur inconnue');
                    setSingleMessage(deploymentResult, 'results error', `Erreur statut: ${message}`);
                }
            } catch (error) {
                setSingleMessage(deploymentResult, 'results error', `Erreur de connexion: ${error.message}`);
            }
        }
    </script>
</body>

</html>
